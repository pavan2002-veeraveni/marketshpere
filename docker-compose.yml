services:
  postgres:
    image: postgres:16-alpine
    container_name: marketsphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketsphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketsphere_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-marketsphere}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketsphere} -d ${POSTGRES_DB:-marketsphere}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketsphere-net

  redis:
    image: redis:7-alpine
    container_name: marketsphere-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketsphere-net

  python-service:
    build:
      context: ./python-services
      dockerfile: Dockerfile
    container_name: marketsphere-python
    restart: unless-stopped
    environment:
      PYTHON_SERVICE_PORT: 8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev_internal_service_token_change_me}
      DEFAULT_TAX_RATE: ${DEFAULT_TAX_RATE:-0.0825}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-USD}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - marketsphere-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketsphere-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-service:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      BACKEND_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-marketsphere}:${POSTGRES_PASSWORD:-marketsphere_dev_pw}@postgres:5432/${POSTGRES_DB:-marketsphere}?schema=public
      REDIS_URL: redis://redis:6379
      PYTHON_SERVICE_URL: http://python-service:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev_internal_service_token_change_me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_jwt_access_secret_min_32_characters_long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_jwt_refresh_secret_min_32_characters_long}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev_payment_webhook_secret_key}
      SHIPPING_WEBHOOK_SECRET: ${SHIPPING_WEBHOOK_SECRET:-dev_shipping_webhook_secret_key}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost}
    ports:
      - "4000:4000"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - marketsphere-net

  background-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketsphere-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-service:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-marketsphere}:${POSTGRES_PASSWORD:-marketsphere_dev_pw}@postgres:5432/${POSTGRES_DB:-marketsphere}?schema=public
      REDIS_URL: redis://redis:6379
      PYTHON_SERVICE_URL: http://python-service:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev_internal_service_token_change_me}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev_payment_webhook_secret_key}
      SHIPPING_WEBHOOK_SECRET: ${SHIPPING_WEBHOOK_SECRET:-dev_shipping_webhook_secret_key}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const net=require('net');const s=net.connect(6379,'redis',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));\""]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - marketsphere-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    container_name: marketsphere-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      INTERNAL_BACKEND_URL: ${INTERNAL_BACKEND_URL:-http://backend:4000}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - marketsphere-net

  nginx:
    image: nginx:1.27-alpine
    container_name: marketsphere-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - marketsphere-net

volumes:
  postgres_data:
  redis_data:
  backend_uploads:

networks:
  marketsphere-net:
    driver: bridge
